[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kqlbridge"
version = "0.11.1"
description = "KQL → Spark SQL / T-SQL transpiler for Microsoft Fabric and Databricks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["kql", "kusto", "spark", "databricks", "fabric", "transpiler", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "lark>=1.1.9",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/navakanth/kqlbridge"
Repository = "https://github.com/navakanth/kqlbridge"
Issues = "https://github.com/navakanth/kqlbridge/issues"

[project.scripts]
kqlbridge = "kqlbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kqlbridge" = ["grammar/*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/kqlbridge"]
omit = ["tests/eval/*"]  # Never instrument the locked oracle
